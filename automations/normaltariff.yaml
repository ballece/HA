## Normaltariff (3 distinct days) automations

- alias: "Normaltariff - Update daily max (06-22)"
  trigger:
    - platform: state
      entity_id: sensor.filtered_hourly_import
  condition:
    - condition: template
      value_template: >
        {{ 6 <= now().hour < 22 }}
  action:
    - variables:
        v: "{{ states('sensor.filtered_hourly_import') | float(0) }}"
        today: "{{ now().date().isoformat() }}"
        stored_date: "{{ states('input_datetime.normaltariff_daily_max_date') }}"
        stored_v: "{{ states('input_number.normaltariff_daily_max') | float(0) }}"
    # If date changed, reset daily max for new day
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ stored_date != today }}
          sequence:
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.normaltariff_daily_max_date
              data:
                date: "{{ today }}"
            - service: input_number.set_value
              target:
                entity_id: input_number.normaltariff_daily_max
              data:
                value: 0
    # Update if higher
    - condition: template
      value_template: >
        {{ v > (states('input_number.normaltariff_daily_max') | float(0)) }}
    - service: input_number.set_value
      target:
        entity_id: input_number.normaltariff_daily_max
      data:
        value: "{{ v }}"

- alias: "Normaltariff - Commit daily max into monthly top3 (22:01)"
  trigger:
    - platform: time
      at: "22:01:00"
    - platform: homeassistant
      event: start
  condition:
    - condition: template
      value_template: >
        {{ now().hour >= 22 }}
  action:
    - variables:
        today: "{{ now().date().isoformat() }}"
        daily_date: "{{ states('input_datetime.normaltariff_daily_max_date') }}"
        daily_max: "{{ states('input_number.normaltariff_daily_max') | float(0) }}"

        t1: "{{ states('input_number.normaltariff_top1') | float(0) }}"
        t2: "{{ states('input_number.normaltariff_top2') | float(0) }}"
        t3: "{{ states('input_number.normaltariff_top3') | float(0) }}"

        d1: "{{ states('input_datetime.normaltariff_top1_date') }}"
        d2: "{{ states('input_datetime.normaltariff_top2_date') }}"
        d3: "{{ states('input_datetime.normaltariff_top3_date') }}"

        # Only accept if today's daily max is from today and > 0
        ok: "{{ daily_date == today and daily_max > 0 }}"
    - condition: template
      value_template: "{{ ok }}"

    # If today already exists in top list, update that slot to daily_max (then we'll reorder)
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ d1 == today }}"
          sequence:
            - service: input_number.set_value
              target: {entity_id: input_number.normaltariff_top1}
              data: {value: "{{ daily_max }}"}
        - conditions:
            - condition: template
              value_template: "{{ d2 == today }}"
          sequence:
            - service: input_number.set_value
              target: {entity_id: input_number.normaltariff_top2}
              data: {value: "{{ daily_max }}"}
        - conditions:
            - condition: template
              value_template: "{{ d3 == today }}"
          sequence:
            - service: input_number.set_value
              target: {entity_id: input_number.normaltariff_top3}
              data: {value: "{{ daily_max }}"}
      default:
        # Insert today into top list if it beats any existing (distinct day guaranteed because today is not in d1/d2/d3)
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ daily_max >= t1 }}"
              sequence:
                - service: input_number.set_value
                  target: {entity_id: input_number.normaltariff_top3}
                  data: {value: "{{ t2 }}"}
                - service: input_datetime.set_datetime
                  target: {entity_id: input_datetime.normaltariff_top3_date}
                  data: {date: "{{ d2 }}"}
                - service: input_number.set_value
                  target: {entity_id: input_number.normaltariff_top2}
                  data: {value: "{{ t1 }}"}
                - service: input_datetime.set_datetime
                  target: {entity_id: input_datetime.normaltariff_top2_date}
                  data: {date: "{{ d1 }}"}
                - service: input_number.set_value
                  target: {entity_id: input_number.normaltariff_top1}
                  data: {value: "{{ daily_max }}"}
                - service: input_datetime.set_datetime
                  target: {entity_id: input_datetime.normaltariff_top1_date}
                  data: {date: "{{ today }}"}
            - conditions:
                - condition: template
                  value_template: "{{ daily_max >= t2 }}"
              sequence:
                - service: input_number.set_value
                  target: {entity_id: input_number.normaltariff_top3}
                  data: {value: "{{ t2 }}"}
                - service: input_datetime.set_datetime
                  target: {entity_id: input_datetime.normaltariff_top3_date}
                  data: {date: "{{ d2 }}"}
                - service: input_number.set_value
                  target: {entity_id: input_number.normaltariff_top2}
                  data: {value: "{{ daily_max }}"}
                - service: input_datetime.set_datetime
                  target: {entity_id: input_datetime.normaltariff_top2_date}
                  data: {date: "{{ today }}"}
            - conditions:
                - condition: template
                  value_template: "{{ daily_max >= t3 }}"
              sequence:
                - service: input_number.set_value
                  target: {entity_id: input_number.normaltariff_top3}
                  data: {value: "{{ daily_max }}"}
                - service: input_datetime.set_datetime
                  target: {entity_id: input_datetime.normaltariff_top3_date}
                  data: {date: "{{ today }}"}
    # Finally recompute normaltariff if 3 distinct days exist
    - variables:
        nt1: "{{ states('input_number.normaltariff_top1') | float(0) }}"
        nt2: "{{ states('input_number.normaltariff_top2') | float(0) }}"
        nt3: "{{ states('input_number.normaltariff_top3') | float(0) }}"
        nd1: "{{ states('input_datetime.normaltariff_top1_date') }}"
        nd2: "{{ states('input_datetime.normaltariff_top2_date') }}"
        nd3: "{{ states('input_datetime.normaltariff_top3_date') }}"
        ready: >
          {{ nt1 > 0 and nt2 > 0 and nt3 > 0 and nd1 not in ['', 'unknown'] and nd2 not in ['', 'unknown'] and nd3 not in ['', 'unknown'] }}
        avg: "{{ (nt1 + nt2 + nt3) / 3 }}"
    - condition: template
      value_template: "{{ ready }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.normaltariff
      data:
        value: "{{ avg }}"

- alias: "Normaltariff - Reset monthly (day 1)"
  trigger:
    - platform: time
      at: "00:00:10"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - service: input_number.set_value
      target:
        entity_id:
          - input_number.normaltariff
          - input_number.normaltariff_daily_max
          - input_number.normaltariff_top1
          - input_number.normaltariff_top2
          - input_number.normaltariff_top3
      data:
        value: 0
    - service: input_datetime.set_datetime
      target:
        entity_id:
          - input_datetime.normaltariff_daily_max_date
          - input_datetime.normaltariff_top1_date
          - input_datetime.normaltariff_top2_date
          - input_datetime.normaltariff_top3_date
      data:
        date: "1970-01-01"