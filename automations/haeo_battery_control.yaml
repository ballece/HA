- alias: Battery Control Loop (15m)
  description: Applies HAEO optimizer output to Huawei inverter every 15 minutes
  trigger:
    - platform: time_pattern
      minutes: /15
  condition: []
  action:
    - choose:
      - conditions:
        - condition: state
          entity_id: sensor.haeo_planned_charging
          state: "True"
        - condition: template
          value_template: "{{ states('sensor.house_consumption_power') | float(0) < 9000 }}"   # If house load already exceeds 9 kW (loading electric car), don't also charge batteries
        sequence:
          - service: huawei_solar.forcible_charge
            data:
              device_id: 898980bfd3e211f7d2b52da0aeee8a91
              duration: 20
              power: "{{ [ (states('sensor.battery_charge_power') | float(0) * 1000) | int, 5000 ] | min }}"
          - service: select.select_option
            target:
              entity_id: select.batteries_working_mode
            data:
              option: fixed_charge_discharge
          - service: switch.turn_on
            target:
              entity_id: switch.batteries_charge_from_grid
      - conditions:
        - condition: state
          entity_id: sensor.haeo_planned_discharging
          state: "True"
        sequence:
          - service: huawei_solar.forcible_discharge
            data:
              device_id: 898980bfd3e211f7d2b52da0aeee8a91
              duration: 20
              power: "{{ [ (states('sensor.battery_discharge_power') | float(0) * 1000) | int, 5000 ] | min }}"
          - service: select.select_option
            target:
              entity_id: select.batteries_working_mode
            data:
              option: fully_fed_to_grid
          - service: switch.turn_off
            target:
              entity_id: switch.batteries_charge_from_grid
      default:
        - service: huawei_solar.stop_forcible_charge
          data:
            device_id: 898980bfd3e211f7d2b52da0aeee8a91
        - service: select.select_option
          target:
            entity_id: select.batteries_working_mode
          data:
            option: maximise_self_consumption
        - service: switch.turn_off
          target:
            entity_id: switch.batteries_charge_from_grid
  mode: single
  
  
- alias: Battery Control Loop Watchdog
  description: Re-enables battery control loop after HA restart (protects against toggle script delay being interrupted)
  trigger:
   - platform: homeassistant
     event: start
  action:
    - service: automation.turn_on
      target:
        entity_id: automation.battery_control_loop_15m
  mode: single

