## Update buy and sell thresholds
- alias: "Update Buy Threshold Based on Buy Cost and Margin"
  trigger:
    - platform: time
      at: "00:15:00"
    - platform: state
      entity_id: input_number.desired_profit_margin
    - platform: state
      entity_id: input_number.elspot_monthly_average
    - platform: state
      entity_id: sensor.elpris_buy_kostnad
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.buy_threshold_ore
      data:
        value: >
          {% set v = (states('sensor.elpris_buy_kostnad') | float(0)) -
                     (states('input_number.desired_profit_margin') | float(0)) %}
          {% set v_min = state_attr('input_number.buy_threshold_ore','min') %}
          {% set v_max = state_attr('input_number.buy_threshold_ore','max') %}
          {{ [v_max, [v_min, v]|max]|min }}

- alias: "Update Sell Threshold Based on Cost"
  trigger:
    - platform: time
      at: "00:20:00"
    - platform: state
      entity_id: input_number.desired_profit_margin
    - platform: state
      entity_id: sensor.elpris_ore_current
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.sell_threshold_ore
      data:
        value: >
          {% set v = (states('sensor.elpris_ore_current') | float(0)) %}
          {% set v_min = state_attr('input_number.sell_threshold_ore','min') %}
          {% set v_max = state_attr('input_number.sell_threshold_ore','max') %}
          {{ [v_max, [v_min, v]|max]|min }}


## Monthly average spot price automations
- alias: "Update monthly average with today's spot prices"
  trigger:
    - platform: time
      at: '00:05:00'
  condition:
    - condition: template
      value_template: "{{ now().day != 1 }}"
  action:
    - variables:
        rows: >
          {% set attrs = state_attr('sensor.elpriser_idag', 'data') %}
          {{ attrs if attrs is iterable else [] }}
        todays_avg: >
          {% set prices = rows | map(attribute='price') | map('float') | list %}
          {% if prices | length > 0 %}
            {{ (prices | sum) / (prices | length) }}
          {% else %}
            0
          {% endif %}
        prev_sum: "{{ states('input_number.elspot_monthly_sum') | float(0) }}"
        prev_days: "{{ states('input_number.elspot_monthly_days') | int(0) }}"
        new_sum: "{{ prev_sum + (todays_avg | float(0)) }}"
        new_days: "{{ prev_days + 1 }}"
        new_avg: >
          {% if new_days > 0 %}
            {{ new_sum / new_days }}
          {% else %}
            0
          {% endif %}
    - service: input_number.set_value
      target:
        entity_id: input_number.elspot_monthly_average
      data:
        value: "{{ new_avg }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.elspot_monthly_sum
      data:
        value: "{{ new_sum }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.elspot_monthly_days
      data:
        value: "{{ new_days }}"

- alias: "Reset Elspot Monthly Average"
  trigger:
    - platform: time
      at: '00:01:00'
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.elspot_monthly_average
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.elspot_monthly_sum
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.elspot_monthly_days
      data:
        value: 0
